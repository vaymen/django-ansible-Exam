---
- name: Check required secrets are provided
  ansible.builtin.assert:
    that:
      - db_password is defined
      - django_secret_key is defined
      - app_allowed_hosts | length > 0
      - app_allowed_hosts != "*"
    fail_msg: "Define db_password and django_secret_key in group_vars/all/vault.yml (see vault.yml.example) and set app_allowed_hosts to your hostname(s), not \"*\"."

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Pull application image (tagged with the git commit id)
  community.docker.docker_image:
    name: "{{ app_image }}"
    source: pull
    force_source: false

- name: Render application environment file (contains secrets)
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/app.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render database environment file (contains secrets)
  ansible.builtin.template:
    src: db.env.j2
    dest: "{{ app_dir }}/db.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start / update the stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    project_name: "{{ app_name }}"
    state: present
    pull: missing
    recreate: auto           # only recreates containers whose config/image/env changed
    wait: true
    wait_timeout: 120

# POSTGRES_PASSWORD is only read when the data volume is first created, so a
# changed db_password in the vault would otherwise leave the DB on the old one.
# ALTER ROLE to the same value is a no-op, hence changed_when: false.
- name: Keep the database role password in sync with the vault
  ansible.builtin.command:
    cmd: >-
      docker compose -p {{ app_name }} -f {{ app_dir }}/docker-compose.yml
      exec -T db psql -v ON_ERROR_STOP=1 -U {{ db_user | quote }} -d {{ db_name | quote }}
    stdin: |
      ALTER ROLE "{{ db_user }}" PASSWORD '{{ db_password | replace("'", "''") }}';
  changed_when: false
  no_log: true
